<section class="app-page" id="page-stocks">
  <div class="app-page-head">
    <div class="app-page-title">标的与指数</div>
    <div class="app-page-desc" id="stockCount">--</div>
    <div class="app-toolbar">
      <button class="mdui-btn mdui-ripple" id="refreshStocks">刷新</button>
      <button class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-theme-accent" id="addStock">新增标的</button>
    </div>
  </div>

  <div class="mdui-card app-card">
    <div class="app-card-head">
      <div class="app-card-title">标的列表</div>
      <div class="app-card-sub">涨跌停价按板块比例自动推算</div>
    </div>
    <div class="mdui-table-fluid">
      <table class="mdui-table">
        <thead>
          <tr>
            <th>代码</th>
            <th>名称</th>
            <th>板块</th>
            <th>行业</th>
            <th class="num">现价</th>
            <th class="num">涨跌幅</th>
            <th class="num">昨收</th>
            <th class="num">涨停</th>
            <th class="num">跌停</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="stocksBody"></tbody>
      </table>
    </div>
  </div>

  <div class="mdui-card app-card">
    <div class="app-card-head">
      <div class="app-card-title">指数</div>
      <div class="app-card-sub">由成分股合成，只读</div>
    </div>
    <div class="mdui-table-fluid">
      <table class="mdui-table">
        <thead>
          <tr>
            <th>代码</th>
            <th>名称</th>
            <th class="num">点位</th>
            <th class="num">涨跌幅</th>
          </tr>
        </thead>
        <tbody id="indicesBody"></tbody>
      </table>
    </div>
  </div>
</section>
