{# 标的与指数 #}
<section class="page" id="page-stocks">
  <div class="toolbar">
    <mdui-button variant="filled" icon="add" id="addStock">新增标的</mdui-button>
    <mdui-button variant="tonal" icon="refresh" id="refreshStocks">刷新</mdui-button>
  </div>

  <div class="table-wrap">
    <table class="mdui-table">
      <thead>
        <tr>
          <th>代码</th><th>名称</th><th>板块</th><th>行业</th>
          <th class="num">昨收</th><th class="num">涨停</th><th class="num">跌停</th>
          <th class="num">成交额</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="stocksBody"></tbody>
    </table>
  </div>

  <div class="table-wrap">
    <table class="mdui-table">
      <thead>
        <tr><th>指数代码</th><th>名称</th><th class="num">昨收</th><th class="num">涨跌幅</th></tr>
      </thead>
      <tbody id="indicesBody"></tbody>
    </table>
  </div>
</section>
