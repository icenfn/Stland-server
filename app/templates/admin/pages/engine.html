{# 模拟引擎 #}
<section class="page" id="page-engine">
  <div class="toolbar">
    <mdui-button variant="filled" id="toggleEngine">启停引擎</mdui-button>
    <mdui-button variant="tonal" icon="restart_alt" id="resetEngine">重置行情</mdui-button>
    <mdui-button variant="text" icon="refresh" id="refreshEngine">刷新</mdui-button>
  </div>

  <mdui-card style="padding: 16px">
    <div style="font-weight: 600; margin-bottom: 12px">引擎状态与参数</div>
    <div class="kpi-grid" id="engineKpis"></div>
  </mdui-card>
</section>
