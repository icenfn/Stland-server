{# 数据初始化 #}
<section class="page" id="page-data">
  <div class="toolbar">
    <mdui-button variant="tonal" icon="refresh" id="refreshSeed">刷新状态</mdui-button>
  </div>

  <mdui-card style="padding: 16px">
    <div style="font-weight: 600; margin-bottom: 12px">当前数据</div>
    <div class="kpi-grid" id="seedStatus"></div>
  </mdui-card>

  <mdui-card style="padding: 16px">
    <div style="font-weight: 600; margin-bottom: 8px">注入初始数据</div>
    <div class="stack">
      <mdui-list>
        <mdui-list-item>
          标的与指数
          <mdui-switch slot="end" id="seedStocks" checked></mdui-switch>
        </mdui-list-item>
        <mdui-list-item>
          演示交易账户
          <mdui-switch slot="end" id="seedUsers" checked></mdui-switch>
        </mdui-list-item>
        <mdui-list-item>
          历史日线
          <mdui-switch slot="end" id="seedHistory" checked></mdui-switch>
        </mdui-list-item>
      </mdui-list>
      <div>
        <mdui-button variant="filled" id="seedBtn">开始注入</mdui-button>
      </div>
    </div>
  </mdui-card>
</section>
