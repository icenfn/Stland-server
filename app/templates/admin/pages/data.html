<section class="app-page" id="page-data">
  <div class="app-page-head">
    <div class="app-page-title">数据初始化</div>
    <div class="app-page-desc">冷启动只建表与引导管理员，标的需要在这里显式注入</div>
    <div class="app-toolbar">
      <button class="mdui-btn mdui-ripple" id="refreshSeed">刷新状态</button>
    </div>
  </div>

  <div class="mdui-card app-card">
    <div class="app-card-head">
      <div class="app-card-title">当前数据量</div>
    </div>
    <div class="app-card-body">
      <div class="app-kpi-grid" id="seedStatus"></div>
    </div>
  </div>

  <div class="mdui-card app-card">
    <div class="app-card-head">
      <div class="app-card-title">注入标准数据集</div>
      <div class="app-card-sub">注入是幂等的，重复执行不会产生副本</div>
    </div>
    <div class="app-card-body">
      <div class="app-checks">
        <label class="mdui-checkbox">
          <input type="checkbox" id="seedStocks" checked />
          <i class="mdui-checkbox-icon"></i>
          标的（28 只标准股与指数成分）
        </label>
        <label class="mdui-checkbox">
          <input type="checkbox" id="seedUsers" checked />
          <i class="mdui-checkbox-icon"></i>
          交易账户（零售与机构样例）
        </label>
        <label class="mdui-checkbox">
          <input type="checkbox" id="seedHistory" checked />
          <i class="mdui-checkbox-icon"></i>
          日线历史（K 线回看数据）
        </label>
      </div>
      <button class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-theme-accent" id="seedBtn">立即注入</button>
    </div>
  </div>
</section>
