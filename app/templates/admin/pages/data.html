{# 数据初始化 #}
<section class="page" id="page-data">
  <div class="toolbar">
    <button class="mdui-btn mdui-ripple mdui-btn-raised" id="refreshSeed">
      <i class="mdui-icon material-icons">refresh</i>刷新状态
    </button>
  </div>

  <div class="mdui-card"><div class="mdui-card-content">
    <div class="mdui-typo-title">当前数据</div>
    <div class="kpi-grid" id="seedStatus"></div>
  </div></div>

  <div class="mdui-card"><div class="mdui-card-content">
    <div class="mdui-typo-title">注入初始数据</div>
    <div class="stack">
      <div class="seed-row">
        <span class="seed-label">标的与指数</span>
        <label class="mdui-switch">
          <input type="checkbox" id="seedStocks" checked />
          <i class="mdui-switch-icon"></i>
        </label>
      </div>
      <div class="seed-row">
        <span class="seed-label">演示交易账户</span>
        <label class="mdui-switch">
          <input type="checkbox" id="seedUsers" checked />
          <i class="mdui-switch-icon"></i>
        </label>
      </div>
      <div class="seed-row">
        <span class="seed-label">历史日线</span>
        <label class="mdui-switch">
          <input type="checkbox" id="seedHistory" checked />
          <i class="mdui-switch-icon"></i>
        </label>
      </div>
      <div>
        <button class="mdui-btn mdui-ripple mdui-btn-raised mdui-color-theme-accent" id="seedBtn">开始注入</button>
      </div>
    </div>
  </div></div>
</section>
