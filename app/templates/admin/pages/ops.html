{# 撮合质量 #}
<section class="page" id="page-ops">
  <div class="toolbar">
    <mdui-button variant="tonal" icon="refresh" id="refreshOps">刷新</mdui-button>
    <mdui-button variant="filled" id="settleBtn">执行日终结转</mdui-button>
  </div>

  <mdui-card style="padding: 16px">
    <div style="font-weight: 600; margin-bottom: 12px">撮合指标</div>
    <div class="kpi-grid" id="matchKpi"></div>
  </mdui-card>

  <mdui-card style="padding: 16px">
    <div style="font-weight: 600; margin-bottom: 12px">成交最活跃标的</div>
    <div class="table-wrap">
      <table class="mdui-table">
        <thead>
          <tr><th>代码</th><th>名称</th><th class="num">成交笔数</th><th class="num">成交额</th><th class="num">成交量</th></tr>
        </thead>
        <tbody id="matchBody"></tbody>
      </table>
    </div>
  </mdui-card>
</section>
