<section class="app-page on" id="page-overview">
  <div class="app-page-head">
    <div class="app-page-title">总览</div>
    <div class="app-page-desc">账户、资产与今日交易的整体情况</div>
    <div class="app-toolbar">
      <button class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-theme" id="refreshOverview">刷新</button>
    </div>
  </div>

  <div class="app-kpi-grid" id="ovKpi"></div>

  <div class="mdui-card app-card">
    <div class="app-card-head">
      <div class="app-card-title">当前会话</div>
      <div class="app-card-sub">交易时段与行情节奏</div>
    </div>
    <div class="app-card-body" id="ovSession"></div>
  </div>

  <div class="mdui-card app-card">
    <div class="app-card-head">
      <div class="app-card-title">总资产排名</div>
      <div class="app-card-sub">含零售与机构，按总资产降序</div>
    </div>
    <div class="mdui-table-fluid">
      <table class="mdui-table">
        <thead>
          <tr>
            <th>登录名</th>
            <th>显示名</th>
            <th>类型</th>
            <th class="num">总资产</th>
            <th class="num">已实现盈亏</th>
            <th class="num">收益率</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </div>
  </div>
</section>
