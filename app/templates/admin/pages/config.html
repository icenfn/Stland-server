<section class="app-page" id="page-config">
  <div class="app-page-head">
    <div class="app-page-title">系统配置</div>
    <div class="app-page-desc">
      与服务自身相关的开关：访问控制与登录安全。模拟盘的市场规则（行情、时段、结算、费率、初始资金）
      已独立到「模拟器 › 模拟器配置」页。
    </div>
    <div class="app-toolbar">
      <button class="mdui-btn mdui-ripple" id="refreshCfg">刷新</button>
      <button class="mdui-btn mdui-ripple" id="resetCfg">恢复本页默认</button>
      <button class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-theme" id="saveCfg">保存修改</button>
    </div>
  </div>

  <div class="mdui-card">
    <div class="app-card-head">
      <div class="app-card-title">安全与访问控制</div>
    </div>
    <div class="app-card-body">
      <div class="app-cfg-grid" id="cfgGrid"></div>
    </div>
  </div>

  <div class="mdui-card app-card">
    <div class="app-card-head">
      <div class="app-card-title">说明</div>
    </div>
    <div class="app-card-body">
      <ul class="mdui-typo">
        <li>关闭「请求签名校验」后服务端不再核对 HMAC 签名，仅建议联调期临时关闭，正式环境保持开启。</li>
        <li>「登录失败锁定阈值」按账号统计连续失败次数，触发后锁定 5 分钟。</li>
        <li>模拟盘相关的行情、交易时段、结算模式、费用与初始资金请到「模拟器 › 模拟器配置」调整。</li>
      </ul>
    </div>
  </div>
</section>
