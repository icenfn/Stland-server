<section class="app-page" id="page-industries">
  <div class="app-page-head">
    <div class="app-page-title">行业管理</div>
    <div class="app-page-desc" id="industryCount">--</div>
    <div class="app-toolbar">
      <button class="mdui-btn mdui-ripple" id="refreshIndustries">刷新</button>
      <button class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-theme-accent" id="addIndustry">新增行业</button>
    </div>
  </div>

  <div class="mdui-card app-card">
    <div class="app-card-head">
      <div class="app-card-title">行业分类</div>
      <div class="app-card-sub">标的通过行业名归属，用于客端行业分布与筛选</div>
    </div>
    <div class="mdui-table-fluid">
      <table class="mdui-table">
        <thead>
          <tr>
            <th>行业</th>
            <th class="num">标的数</th>
            <th class="num">排序</th>
            <th>说明</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="industriesBody"></tbody>
      </table>
    </div>
  </div>
</section>
