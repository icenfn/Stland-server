{# 零售账户 #}
<section class="page" id="page-retail">
  <div class="toolbar">
    <button class="mdui-btn mdui-ripple mdui-btn-raised mdui-color-theme-accent" id="addRetail"><i class="mdui-icon material-icons">person_add</i>新增零售账户</button>
    <button class="mdui-btn mdui-ripple mdui-btn-raised" id="refreshRetail"><i class="mdui-icon material-icons">refresh</i>刷新</button>
    <span style="opacity: .7; font-size: 13px" id="retailTotal"></span>
  </div>

  <div class="mdui-table-fluid">
    <table class="mdui-table">
      <thead>
        <tr>
          <th>用户名</th><th>昵称</th><th>状态</th><th>风险偏好</th>
          <th class="num">可用资金</th><th class="num">持仓市值</th><th class="num">总资产</th>
          <th class="num">浮动盈亏</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="retailBody"></tbody>
    </table>
  </div>
</section>
