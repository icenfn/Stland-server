<section class="app-page" id="page-retail">
  <div class="app-page-head">
    <div class="app-page-title">零售账户</div>
    <div class="app-page-desc" id="retailCount">--</div>
    <div class="app-toolbar">
      <input class="app-select" id="retailSearch" placeholder="按登录名或昵称搜索" style="width:200px" />
      <button class="mdui-btn mdui-ripple" id="refreshRetail">刷新</button>
      <button class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-theme-accent" id="addRetail">新建账户</button>
    </div>
  </div>

  <div class="mdui-card">
    <div class="mdui-table-fluid">
      <table class="mdui-table">
        <thead>
          <tr>
            <th>登录名</th>
            <th>显示名</th>
            <th>状态</th>
            <th>风险</th>
            <th class="num">可用资金</th>
            <th class="num">冻结</th>
            <th class="num">持仓市值</th>
            <th class="num">总资产</th>
            <th class="num">持仓数</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="retailBody"></tbody>
      </table>
    </div>
  </div>
</section>
