{# 机构账户 #}
<section class="page" id="page-institution">
  <div class="toolbar">
    <button class="mdui-btn mdui-ripple mdui-btn-raised mdui-color-theme-accent" id="addInstitution"><i class="mdui-icon material-icons">domain_add</i>新增机构账户</button>
    <button class="mdui-btn mdui-ripple mdui-btn-raised" id="refreshInstitution"><i class="mdui-icon material-icons">refresh</i>刷新</button>
    <span style="opacity: .7; font-size: 13px" id="instTotal"></span>
  </div>

  <div class="mdui-table-fluid">
    <table class="mdui-table">
      <thead>
        <tr>
          <th>用户名</th><th>昵称</th><th>状态</th><th class="num">授信额度</th>
          <th class="num">可用资金</th><th class="num">持仓市值</th><th class="num">总资产</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="instBody"></tbody>
    </table>
  </div>
</section>
