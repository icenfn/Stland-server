<section class="app-page" id="page-institution">
  <div class="app-page-head">
    <div class="app-page-title">机构账户</div>
    <div class="app-page-desc" id="instCount">--</div>
    <div class="app-toolbar">
      <input class="app-select" id="instSearch" placeholder="按登录名或昵称搜索" style="width:200px" />
      <button class="mdui-btn mdui-ripple" id="refreshInst">刷新</button>
      <button class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-theme-accent" id="addInst">新建账户</button>
    </div>
  </div>

  <div class="mdui-card">
    <div class="mdui-table-fluid">
      <table class="mdui-table">
        <thead>
          <tr>
            <th>登录名</th>
            <th>显示名</th>
            <th>状态</th>
            <th class="num">可用资金</th>
            <th class="num">授信额度</th>
            <th class="num">持仓市值</th>
            <th class="num">总资产</th>
            <th class="num">已实现盈亏</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="instBody"></tbody>
      </table>
    </div>
  </div>
</section>
