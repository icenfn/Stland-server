{# 风险偏好 #}
<section class="page" id="page-risk">
  <div class="toolbar">
    <mdui-button variant="tonal" icon="refresh" id="refreshRisk">刷新</mdui-button>
  </div>

  <mdui-card style="padding: 16px">
    <div style="font-weight: 600; margin-bottom: 12px">风险测评分布</div>
    <div class="kpi-grid" id="riskDist"></div>
  </mdui-card>

  <mdui-card style="padding: 16px">
    <div style="font-weight: 600; margin-bottom: 12px">收益榜</div>
    <div class="table-wrap">
      <table class="mdui-table">
        <thead>
          <tr>
            <th>用户名</th><th>昵称</th><th>角色</th>
            <th class="num">总资产</th><th class="num">已实现盈亏</th><th class="num">收益率</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </div>
  </mdui-card>
</section>
