<section class="app-page" id="page-risk">
  <div class="app-page-head">
    <div class="app-page-title">风险偏好</div>
    <div class="app-page-desc">当前分布与总资产排名，测评由客户端完成</div>
    <div class="app-toolbar">
      <button class="mdui-btn mdui-ripple" id="refreshRisk">刷新</button>
    </div>
  </div>

  <div class="mdui-card app-card">
    <div class="app-card-head">
      <div class="app-card-title">分布</div>
    </div>
    <div class="app-card-body">
      <div class="app-kpi-grid" id="riskDist"></div>
    </div>
  </div>

  <div class="mdui-card app-card">
    <div class="app-card-head">
      <div class="app-card-title">总资产排名</div>
      <div class="app-card-sub">含零售与机构，按总资产降序</div>
    </div>
    <div class="mdui-table-fluid">
      <table class="mdui-table">
        <thead>
          <tr>
            <th>登录名</th>
            <th>显示名</th>
            <th>类型</th>
            <th class="num">总资产</th>
            <th class="num">已实现盈亏</th>
            <th class="num">收益率</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
    </div>
  </div>
</section>
