{# 登录：整页只有一张 mdui 卡片，样式全部来自组件 #}
<div id="login">
  <div style="display: flex; justify-content: center; padding: 12vh 16px 0">
    <mdui-card style="width: 100%; max-width: 380px; padding: 24px">
      <div style="font-size: 20px; font-weight: 600; margin-bottom: 4px">Stland 运营后台</div>
      <div style="opacity: .65; font-size: 13px; margin-bottom: 16px">请使用管理员账号登录</div>

      <form id="loginForm" class="stack">
        <mdui-text-field label="用户名" id="username" autocomplete="username"></mdui-text-field>
        <mdui-text-field label="口令" id="password" type="password" autocomplete="current-password"></mdui-text-field>
        <div id="loginErr" style="color: var(--mdui-color-error); font-size: 12px; min-height: 16px"></div>
        <mdui-button type="submit" variant="filled" id="loginBtn" style="width: 100%">登录</mdui-button>
      </form>
    </mdui-card>
  </div>
</div>
