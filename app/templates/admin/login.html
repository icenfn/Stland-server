{# 登录：整页只有一张 mdui 卡片，外观全部来自组件 #}
<div id="login">
  <div class="login-wrap">
    <div class="mdui-card">
      <div class="mdui-card-content">
        <div class="mdui-typo-title">Stland 运营后台</div>
        <div class="login-sub">请使用管理员账号登录</div>

        <form id="loginForm" class="stack">
          <div class="mdui-textfield">
            <label class="mdui-textfield-label">用户名</label>
            <input class="mdui-textfield-input" id="username" autocomplete="username" />
          </div>
          <div class="mdui-textfield">
            <label class="mdui-textfield-label">口令</label>
            <input class="mdui-textfield-input" id="password" type="password" autocomplete="current-password" />
          </div>
          <div id="loginErr" class="login-err"></div>
          <button class="mdui-btn mdui-btn-block mdui-ripple mdui-btn-raised mdui-color-theme-accent" type="submit" id="loginBtn">登录</button>
        </form>
      </div>
    </div>
  </div>
</div>
